version: "3.8"

# Mersennet Trade stack: Postgres + API + indexer + Next.js web.
# TLS / vhost routing is handled by Caddy on the host (trade.mersennet.com
# proxies / -> web:3000 and /api, /ws -> api:4005).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mersennet_trade
      POSTGRES_USER: mersennet
      # From the host .env (POSTGRES_PASSWORD=…). No default: never bake a DB
      # password into the image/compose.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mersennet"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4005"
      DATABASE_URL: postgresql://mersennet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/mersennet_trade
      RPC_URL: ${RPC_URL:-https://rpc.mersennet.com}
      WS_URL: ${WS_URL:-wss://rpc.mersennet.com}
      # Report user-order fills to the indexer (the node emits no WS trade event
      # for submitOrder RPC fills) so trades/volume/charts populate.
      INDEXER_REPORT_URL: http://indexer:4010/trades
      REPORT_SECRET: ${REPORT_SECRET:?REPORT_SECRET must be set in .env}
    ports:
      - "127.0.0.1:4005:4005"
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mersennet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/mersennet_trade
      RPC_URL: ${RPC_URL:-https://rpc.mersennet.com}
      WS_URL: ${WS_URL:-wss://rpc.mersennet.com}
      API_BASE: http://api:4005/api/v1
      # Accept fill reports from the api/bots over the internal network, gated by
      # a shared secret so the write endpoint can't be used to forge volume/PnL.
      REPORT_HOST: 0.0.0.0
      REPORT_SECRET: ${REPORT_SECRET:?REPORT_SECRET must be set in .env}
      # Exclude the deterministic bot wallets from leaderboard/points.
      BOT_ADDRESSES: ${BOT_ADDRESSES:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # Liquidity bots — keep the order book quoted and generate trade activity so
  # the testnet looks alive. They seed the 5 markets on a fresh chain, deposit
  # collateral, and report fills to the indexer. Start with `--profile bots`
  # (e.g. `docker compose --profile bots up -d`) so they're opt-in.
  market-maker:
    build:
      context: ./bots/market-maker
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "index.js"]
    environment:
      RPC_URL: ${RPC_URL:-https://rpc.mersennet.com}
      INDEXER_URL: http://indexer:4010/trades
      REPORT_SECRET: ${REPORT_SECRET:?REPORT_SECRET must be set in .env}
      # Deterministic signing seed for the maker/taker wallets. The derived
      # addresses must be funded with native MRSN at genesis (bot-addresses.js).
      BOT_SEED: ${BOT_SEED:-mersennet-bot-v1}
      CHAIN_ID: ${CHAIN_ID:-131071}
      MM_PRIVATE_KEY: ${MM_PRIVATE_KEY:-}
    depends_on:
      - indexer
    profiles: ["bots"]

  taker:
    build:
      context: ./bots/market-maker
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "taker.js"]
    environment:
      RPC_URL: ${RPC_URL:-https://rpc.mersennet.com}
      INDEXER_URL: http://indexer:4010/trades
      REPORT_SECRET: ${REPORT_SECRET:?REPORT_SECRET must be set in .env}
      BOT_SEED: ${BOT_SEED:-mersennet-bot-v1}
      CHAIN_ID: ${CHAIN_ID:-131071}
      NUM_TAKERS: ${NUM_TAKERS:-20}
    depends_on:
      - market-maker
    profiles: ["bots"]

volumes:
  pgdata:
