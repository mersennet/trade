name: CI

# Each component's job runs only when that component — or this workflow —
# changed (started as a cost measure while the repository was private; kept
# because it keeps PR feedback fast). A Monday full run catches dependency and
# audit drift on the parts that did not change.
on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC: everything, regardless of changes
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: every job only reads the checkout; the
# change detector additionally reads the pull request to list its files.
permissions:
  contents: read

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # A change outside the four components (compose file, smoke test, workflows, anything
    # new) runs every job: skipping them all let such a change pass as a green CI.
    # Only plain documents at the root (*.md, LICENSE) skip everything.
    outputs:
      web: ${{ steps.f.outputs.web == 'true' || steps.o.outputs.other == 'true' || github.event_name != 'push' && github.event_name != 'pull_request' }}
      api: ${{ steps.f.outputs.api == 'true' || steps.o.outputs.other == 'true' || github.event_name != 'push' && github.event_name != 'pull_request' }}
      bots: ${{ steps.f.outputs.bots == 'true' || steps.o.outputs.other == 'true' || github.event_name != 'push' && github.event_name != 'pull_request' }}
      indexer: ${{ steps.f.outputs.indexer == 'true' || steps.o.outputs.other == 'true' || github.event_name != 'push' && github.event_name != 'pull_request' }}
      repo: ${{ steps.o.outputs.other == 'true' || github.event_name != 'push' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          # A push compares against the previous commit on the branch (the
          # merge commit's first parent on main); a PR against its base.
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
            web:
              - *shared
              - 'web/**'
            api:
              - *shared
              - 'api/**'
            bots:
              - *shared
              - 'bots/**'
            indexer:
              - *shared
              - 'indexer/**'
      - uses: dorny/paths-filter@v3
        id: o
        with:
          # 'every': a file counts only if it matches all of these, i.e. it lies
          # outside the components and is not a root document.
          predicate-quantifier: 'every'
          filters: |
            other:
              - '**'
              - '!web/**'
              - '!api/**'
              - '!bots/**'
              - '!indexer/**'
              - '!*.md'
              - '!LICENSE'

  repo:
    name: repo — compose file, smoke test, audit
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker-compose.yml is valid
        run: docker compose -f docker-compose.yml config --no-interpolate -q
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: smoke/package-lock.json }
      - name: Smoke test parses and its dependencies are clean
        working-directory: smoke
        run: |
          npm ci
          node --check smoke.mjs
          npm audit --audit-level=high

  web:
    name: web (Next.js) — lint, build, audit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: TP/SL bracket rules
        run: node scripts/test-brackets.mjs
      - run: npm run build
      - name: npm audit --audit-level=high (time-limited exceptions in audit-allowlist.json)
        run: node scripts/audit.mjs

  api:
    name: api — syntax, load, audit
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - name: Syntax-check every source file
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Modules load (no DB needed at require time)
        run: node -e "require('./src/services/chain.js'); require('./src/routes/feedback.js'); require('./src/services/exchangeHealth.js'); console.log('ok')"
      - run: npm audit --audit-level=high

  bots:
    name: bots — syntax, address derivation, audit
    needs: changes
    if: needs.changes.outputs.bots == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: bots/market-maker }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: bots/market-maker/package-lock.json }
      - run: npm ci
      - run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Deterministic bot addresses (guards the key-derivation path)
        run: |
          JSON=1 BOT_SEED=ci-seed node bot-addresses.js 3 | python3 -c "import json,sys; a=json.load(sys.stdin); assert len(a)==4 and all(x.startswith('0x') and len(x)==42 for x in a); print('derived', len(a))"
      - run: npm audit --audit-level=high

  indexer:
    name: indexer — syntax, audit
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: indexer }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: indexer/package-lock.json }
      - run: npm ci
      - run: find . -maxdepth 2 -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - run: npm audit --audit-level=high

  # One status for branch rules and badges, green when the change detector ran
  # and every job that ran passed (the rest were skipped by the path filter). A
  # failed detector skips every job, which must not read as a pass.
  ci:
    name: CI
    needs: [changes, repo, web, api, bots, indexer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} repo=${{ needs.repo.result }} web=${{ needs.web.result }} api=${{ needs.api.result }} bots=${{ needs.bots.result }} indexer=${{ needs.indexer.result }}"
          [ "${{ needs.changes.result }}" = success ] || { echo "change detection did not succeed"; exit 1; }
          for r in "${{ needs.repo.result }}" "${{ needs.web.result }}" "${{ needs.api.result }}" "${{ needs.bots.result }}" "${{ needs.indexer.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job failed or was cancelled"; exit 1 ;; esac
          done
